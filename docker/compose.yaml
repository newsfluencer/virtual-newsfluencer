# Virtual Newsfluencer - application stack
# Copy .example.env to .env
#
# Start:  docker compose --env-file ../.env up -d
# Stop:   docker compose --env-file ../.env down
#
# Use docker compose --env-file ../.env config to see which values are used
name: ${COMPOSE_PROJECT_NAME}

services:
  frontend:
    image: nginx:alpine
    ports:
      - "${FRONTEND_BIND}:${FRONTEND_PORT}:80"
    restart: unless-stopped
    networks:
      - bridge-front

  backend:
    image: php:8.4-apache
    restart: unless-stopped
    networks:
      - bridge-front
      - bridge-back

  llm:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - llm:/root/.ollama
    networks:
      - bridge-back

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - bridge-back

    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"

volumes:
  llm:
  database:

networks:
  bridge-front:
  bridge-back:
    # internal: true
